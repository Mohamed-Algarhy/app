<!-- RIGHT SIDEBAR -->
<div class="lg:col-start-10 lg:col-end-13">
  <aside>
    <div class="bg-white rounded-2xl shadow-sm p-4 space-y-4">
      <h3 class="font-semibold text-sm">Suggested Friends</h3>

      <input
        [(ngModel)]="myWords"
        type="text"
        placeholder="Search friends..."
        class="w-full bg-gray-100 rounded-lg px-3 py-2 text-sm focus:outline-none"
      />

      <!-- Friend Item -->
      <div class="space-y-3">
        @for (friend of allFrindes() | serchFollwoers: myWords; track friend) {
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 bg-gray-300 rounded-full">
                <img [src]="friend.photo" alt="" />
              </div>
              <div>
                <p class="text-sm font-medium">{{ friend.name }}</p>
                <p class="text-xs text-gray-500">{{ friend.mutualFollowersCount }}</p>
              </div>
            </div>
            <button class="px-3 py-1 text-xs bg-blue-500 text-white rounded-lg hover:bg-blue-600">
              Follow
            </button>
          </div>
        }
      </div>

      <button class="w-full text-sm text-blue-600 font-medium hover:underline">View more</button>
    </div>
  </aside>
</div>
