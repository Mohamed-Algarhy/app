<div class="gap-2 py-5 px-30 bg-gray-200 grid grid-cols-12">
  <div class="col-start-1 col-end-3">
    <!-- LEFT SIDEBAR -->
    <div class="lg:col-start-1 lg:col-end-4">
      <aside>
        <div class="bg-white rounded-2xl shadow-sm p-4 space-y-2">
          <button
            routerLink="/feed"
            routerLinkActive="bg-blue-50 text-blue-600 font-medium"
            class="w-full cursor-pointer flex items-center gap-3 px-3 py-2 text-gray-600 hover:bg-gray-50 rounded-xl"
          >
            <i class="fa-solid fa-house"></i>
            Feed
          </button>
          <button
            routerLink=""
            routerLinkActive="bg-blue-50 text-blue-600 font-medium"
            class="w-full cursor-pointer flex items-center gap-3 px-3 py-2"
          >
            <i class="fa-solid fa-hashtag"></i>
            My Posts
          </button>
          <button
            routerLink=""
            routerLinkActive="bg-blue-50 text-blue-600 font-medium"
            class="w-full cursor-pointer flex items-center gap-3 px-3 py-2 text-gray-600 hover:bg-gray-50 rounded-xl"
          >
            <i class="fa-solid fa-users"></i>
            Community
          </button>
          <button
            routerLink=""
            routerLinkActive="bg-blue-50 text-blue-600 font-medium"
            class="w-full cursor-pointer flex items-center gap-3 px-3 py-2 text-gray-600 hover:bg-gray-50 rounded-xl"
          >
            <i class="fa-regular fa-bookmark"></i>
            Saved
          </button>
        </div>
      </aside>
    </div>
  </div>

  <div class="col-start-3 col-end-10">
    <app-createpost (creatPostEvent)="feedgetAllPosts($event)"></app-createpost>
    <!-- استدعِ الـ Signal كدالة وضع الـ track المناسب مثل item._id -->
    @for (onePostParent of allPosts(); track onePostParent._id) {
      <app-posts [onePost]="onePostParent" (postDeleted)="removePost($event)"></app-posts>
    }
  </div>
  <div class="col-start-10 col-end-13">
    <!-- right SIDEBAR -->
    <app-suggfriends></app-suggfriends>
  </div>
</div>
