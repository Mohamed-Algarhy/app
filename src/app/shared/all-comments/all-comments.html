  <!-- Header -->
  <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-2 font-semibold text-gray-700">
          <span>Comments</span>
          <span class="bg-blue-100 text-blue-600 text-xs px-2 py-0.5 rounded-full">
              1
          </span>
      </div>
      
      <button class="flex items-center gap-2 text-sm text-gray-600 border px-3 py-1.5 rounded-lg hover:bg-gray-50">
          Most relevant
          <i class="fa-solid fa-chevron-down text-xs"></i>
      </button>
  </div>
  
  
@for (oneComment of allComments(); track oneComment._id) {
<div class="bg-white rounded-2xl border border-gray-200 p-4">
    
    <!-- Comment -->
    <div class="flex gap-3">
        
        <!-- Avatar -->
        <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center">
            <!-- <i class="fa-solid fa-user text-gray-400"></i> -->
             <img [src]="oneComment.commentCreator.photo" alt="">
        </div>

        <!-- Comment Content -->
        <div class="flex-1">
            
            <div class="bg-gray-100 rounded-2xl px-4 py-2 inline-block">
                <p class="font-semibold text-sm text-gray-800">
                    {{oneComment.commentCreator.name}}
                </p>
                
                <p class="text-xs text-gray-500 mb-1">
                    {{oneComment.commentCreator.username}} · {{oneComment.createdAt}}
                </p>
                
                <p class="text-sm text-gray-700">
                    {{oneComment.content}}
                </p>
            </div>
            
            <!-- Actions -->
            <div class="flex items-center gap-4 text-xs text-gray-500 mt-2">
                <span></span>
                
                <button class="hover:text-blue-600">
                    Like ({{oneComment.likes.length}})
                </button>
                
                <button class="hover:text-blue-600">
                    Reply
                </button>
                
                <button class="ml-auto text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-ellipsis"></i>
                </button>
            </div>
            
        </div>
        
    </div>
</div>
}
@empty {
    <p class="bg-blue-700">sorery no comment yet </p>
}
